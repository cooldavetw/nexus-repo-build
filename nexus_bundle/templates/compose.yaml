services:
  nexus:
    image: ${NEXUS_IMAGE:?Run from the bundle directory}
    platform: ${CONTAINER_PLATFORM}
    pull_policy: never
    ports:
      - "${NEXUS_BIND:-127.0.0.1}:${NEXUS_PORT:-8081}:8081"
    volumes:
      - nexus-data:/nexus-data
    restart: unless-stopped
  uploader:
    image: ${UPLOADER_IMAGE}
    platform: ${CONTAINER_PLATFORM}
    pull_policy: never
    profiles: [tools]
    environment:
      NEXUS_URL: http://nexus:8081
      NEXUS_REPOSITORY: ${NEXUS_REPOSITORY}
      NEXUS_USERNAME: ${NEXUS_USERNAME:-admin}
      NEXUS_PASSWORD: ${NEXUS_PASSWORD:-}
      NEXUS_INITIAL_PASSWORD: ${NEXUS_INITIAL_PASSWORD:-}
    volumes:
      - ./wheels:/wheels:ro
      - ./scripts:/scripts:ro
      - ./requirements.txt:/requirements.txt:ro
    entrypoint: [python, /scripts/nexus_admin.py]
volumes:
  nexus-data:
